<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telégrafo ASCII — Codificador / Decodificador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #ede6d6;
    --paper-dark: #e2d9c4;
    --ink: #2b2420;
    --ink-soft: #5a5044;
    --perforation: #b8ab93;
    --stamp-red: #ab3a2c;
    --stamp-teal: #3d6b63;
    --card-shadow: rgba(43,36,32,0.18);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(43,36,32,0.06) 1px, transparent 0);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: 'Source Serif 4', serif;
    min-height: 100vh;
  }

  .wrap{
    max-width: 780px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }

  header{
    text-align: center;
    margin-bottom: 40px;
  }

  .eyebrow{
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }

  h1{
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: clamp(28px, 5vw, 42px);
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }

  h1 span{ color: var(--stamp-red); }

  .sub{
    font-size: 16px;
    color: var(--ink-soft);
    max-width: 480px;
    margin: 0 auto;
    line-height: 1.5;
  }

  /* Mode switch styled as a two-position lever */
  .lever{
    display: flex;
    justify-content: center;
    margin: 32px 0 28px;
  }
  .lever-track{
    display: inline-flex;
    background: var(--ink);
    border-radius: 999px;
    padding: 4px;
    gap: 4px;
  }
  .lever-track button{
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.05em;
    padding: 10px 20px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--paper-dark);
    cursor: pointer;
    transition: background 0.25s ease, color 0.25s ease;
  }
  .lever-track button.active{
    background: var(--paper);
    color: var(--ink);
  }

  /* Ticket / punch-card style panels */
  .ticket{
    background: var(--paper);
    border: 1px solid var(--ink);
    border-radius: 4px;
    box-shadow: 6px 6px 0 var(--card-shadow);
    padding: 22px;
    margin-bottom: 22px;
    position: relative;
  }
  .ticket::before{
    content: "";
    position: absolute;
    top: -1px; bottom: -1px; left: 14px;
    width: 0;
    border-left: 2px dashed var(--perforation);
  }

  .ticket-label{
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 10px;
    padding-left: 20px;
  }

  textarea{
    width: 100%;
    min-height: 100px;
    resize: vertical;
    background: transparent;
    border: none;
    font-family: 'Space Mono', monospace;
    font-size: 16px;
    color: var(--ink);
    padding: 0 4px 0 20px;
    outline: none;
    line-height: 1.6;
  }
  textarea::placeholder{ color: #a89c86; }

  .controls-row{
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    padding-left: 20px;
    margin-top: 14px;
  }

  select, .btn{
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    padding: 8px 12px;
    border: 1px solid var(--ink);
    border-radius: 3px;
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
  }

  .btn.primary{
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .btn.primary:hover{ background: var(--stamp-red); border-color: var(--stamp-red); }
  .btn:not(.primary):hover{ background: var(--paper-dark); }

  .btn.copy{ margin-left: auto; }

  /* Output — teleprinter feel */
  .output-body{
    padding-left: 20px;
    font-family: 'Space Mono', monospace;
    font-size: 16px;
    min-height: 60px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .output-body .ch{
    display: inline-block;
    opacity: 0;
    animation: punch 0.28s ease forwards;
  }
  @keyframes punch{
    from{ opacity: 0; transform: translateY(-3px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  .cursor{
    display: inline-block;
    width: 9px;
    height: 18px;
    background: var(--stamp-red);
    vertical-align: text-bottom;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity: 0; } }

  .hint{
    font-size: 13px;
    color: var(--ink-soft);
    padding-left: 20px;
    margin-top: 4px;
  }

  footer{
    text-align: center;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
    margin-top: 40px;
  }

  @media (max-width: 480px){
    .ticket{ padding: 18px 16px; }
    .ticket-label, textarea, .output-body, .hint, .controls-row{ padding-left: 14px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">Estación de cifrado No. 7</div>
    <h1>Telégrafo <span>ASCII</span></h1>
    <p class="sub">Convierte texto a código ASCII y viceversa. Pega el código, elige el formato y la estación lo imprime letra por letra.</p>
  </header>

  <div class="lever">
    <div class="lever-track">
      <button id="modeDecode" class="active">Decodificar → Texto</button>
      <button id="modeEncode">Texto → Codificar</button>
    </div>
  </div>

  <div class="ticket">
    <div class="ticket-label" id="inputLabel">Código ASCII de entrada</div>
    <textarea id="input" placeholder="72 101 108 108 111"></textarea>
    <div class="controls-row">
      <label class="hint" style="padding-left:0;">Formato:</label>
      <select id="format">
        <option value="auto">Auto-detectar</option>
        <option value="dec">Decimal</option>
        <option value="hex">Hexadecimal</option>
        <option value="bin">Binario</option>
        <option value="oct">Octal</option>
      </select>
      <button class="btn primary" id="runBtn">Transmitir</button>
      <button class="btn" id="clearBtn">Borrar</button>
    </div>
  </div>

  <div class="ticket">
    <div class="ticket-label">Resultado</div>
    <div class="output-body" id="output"><span class="cursor"></span></div>
    <div class="controls-row" style="margin-top:10px;">
      <button class="btn copy" id="copyBtn">Copiar resultado</button>
    </div>
  </div>

  <footer>ESTACIÓN LOCAL · SIN CONEXIÓN A SERVIDOR · TODO OCURRE EN TU NAVEGADOR</footer>
</div>

<script>
  const input = document.getElementById('input');
  const output = document.getElementById('output');
  const format = document.getElementById('format');
  const runBtn = document.getElementById('runBtn');
  const clearBtn = document.getElementById('clearBtn');
  const copyBtn = document.getElementById('copyBtn');
  const modeDecode = document.getElementById('modeDecode');
  const modeEncode = document.getElementById('modeEncode');
  const inputLabel = document.getElementById('inputLabel');

  let mode = 'decode'; // 'decode' = ascii->text, 'encode' = text->ascii

  function setMode(newMode){
    mode = newMode;
    modeDecode.classList.toggle('active', mode === 'decode');
    modeEncode.classList.toggle('active', mode === 'encode');
    format.style.display = mode === 'decode' ? 'inline-block' : 'none';
    if(mode === 'decode'){
      inputLabel.textContent = 'Código ASCII de entrada';
      input.placeholder = '72 101 108 108 111';
    } else {
      inputLabel.textContent = 'Texto de entrada';
      input.placeholder = 'Hola mundo';
    }
    output.innerHTML = '<span class="cursor"></span>';
  }

  modeDecode.addEventListener('click', () => setMode('decode'));
  modeEncode.addEventListener('click', () => setMode('encode'));

  function detectFormat(tokens){
    const sample = tokens.join('');
    if(/^[01]+$/.test(sample)) return 'bin';
    if(/^[0-9a-fA-F]+$/.test(sample) && /[a-fA-F]/.test(sample)) return 'hex';
    if(tokens.every(t => /^[0-7]+$/.test(t)) && tokens.some(t => t.length > 2)) return 'oct';
    return 'dec';
  }

  function decodeAscii(raw, fmt){
    const tokens = raw.trim().split(/[\s,;]+/).filter(Boolean);
    if(tokens.length === 0) return '';
    let useFmt = fmt;
    if(fmt === 'auto') useFmt = detectFormat(tokens);

    const codes = tokens.map(t => {
      t = t.replace(/^0x/i, '');
      let n;
      if(useFmt === 'bin') n = parseInt(t, 2);
      else if(useFmt === 'hex') n = parseInt(t, 16);
      else if(useFmt === 'oct') n = parseInt(t, 8);
      else n = parseInt(t, 10);
      return n;
    });

    if(codes.some(n => Number.isNaN(n))) {
      throw new Error('No se pudo interpretar el código con el formato seleccionado.');
    }
    return codes.map(n => String.fromCharCode(n)).join('');
  }

  function encodeText(text, fmt){
    // for encode mode, always output decimal (most common request)
    return text.split('').map(ch => ch.charCodeAt(0)).join(' ');
  }

  function printTeleprinter(text){
    output.innerHTML = '';
    if(text.length === 0){
      output.innerHTML = '<span class="cursor"></span>';
      return;
    }
    const chars = text.split('');
    chars.forEach((ch, i) => {
      const span = document.createElement('span');
      span.className = 'ch';
      span.textContent = ch === ' ' ? '\u00A0' : ch;
      span.style.animationDelay = (i * 22) + 'ms';
      output.appendChild(span);
    });
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    cursor.style.marginLeft = '2px';
    output.appendChild(cursor);
  }

  function run(){
    const raw = input.value;
    if(!raw.trim()){
      printTeleprinter('');
      return;
    }
    try{
      let result;
      if(mode === 'decode'){
        result = decodeAscii(raw, format.value);
      } else {
        result = encodeText(raw);
      }
      printTeleprinter(result);
    }catch(e){
      output.innerHTML = '';
      const span = document.createElement('span');
      span.className = 'ch';
      span.style.color = 'var(--stamp-red)';
      span.textContent = '⚠ ' + e.message;
      output.appendChild(span);
    }
  }

  runBtn.addEventListener('click', run);
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)) run();
  });

  clearBtn.addEventListener('click', () => {
    input.value = '';
    output.innerHTML = '<span class="cursor"></span>';
  });

  copyBtn.addEventListener('click', () => {
    const text = Array.from(output.querySelectorAll('.ch')).map(s => s.textContent).join('').replace(/\u00A0/g, ' ');
    if(!text) return;
    navigator.clipboard.writeText(text).then(() => {
      copyBtn.textContent = 'Copiado ✓';
      setTimeout(() => copyBtn.textContent = 'Copiar resultado', 1400);
    });
  });

  setMode('decode');
</script>

</body>
</html>
